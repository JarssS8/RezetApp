<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --bg: oklch(0.982 0.005 120); --bg2: oklch(0.955 0.007 120); --surface:#ffffff; --surface2: oklch(0.968 0.006 120);
  --text: oklch(0.235 0.012 150); --muted: oklch(0.53 0.012 150); --line: oklch(0.905 0.008 150);
  --accent: oklch(0.54 0.105 156); --warn: oklch(0.545 0.13 62);
  --shadow-l: 0 2px 6px rgba(20,35,20,.08), 0 24px 60px rgba(20,35,20,.14);
  --soft: color-mix(in oklab, var(--accent) 15%, var(--bg)); --soft2: color-mix(in oklab, var(--accent) 26%, var(--bg));
  --onaccent:#ffffff; --accent-ink: color-mix(in oklab, var(--accent) 85%, black);
}
html,body{margin:0;padding:0;height:100%}
body{background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
@keyframes scanline{0%{transform:translateY(-28px);opacity:0}50%{opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes spark{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1.15);opacity:1}}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="position:relative;width:100%;height:100%;background:linear-gradient(180deg, #1b1f1c 0%, #0e100e 100%);overflow:hidden">

  <!-- dimmed live-camera placeholder -->
  <div style="position:absolute;inset:0;display:grid;place-items:center;opacity:.5">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.4">
      <rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13.5" r="3.6"/>
    </svg>
  </div>
  <div style="position:absolute;top:18px;left:20px;display:flex;align-items:center;gap:7px">
    <div style="width:7px;height:7px;border-radius:99px;background:#ff5252;animation:livedot 1.4s ease-in-out infinite"></div>
    <div style="font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:.02em">EN VIVO</div>
  </div>
  <button type="button" onClick="{{ skip }}" style="position:absolute;top:14px;right:14px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:550;color:rgba(255,255,255,.75)">Saltar</button>

  <!-- coach-mark sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top-left-radius:26px;border-top-right-radius:26px;box-shadow:var(--shadow-l);padding:22px 22px 26px;animation:rise .32s cubic-bezier(.2,.8,.2,1) both">

    <div style="height:150px;border-radius:22px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;margin-bottom:20px">

      <sc-if value="{{ isBarcode }}" hint-placeholder-val="{{ true }}">
        <div style="position:relative;width:120px;height:82px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-l);display:grid;place-items:center;overflow:hidden">
          <div style="display:flex;gap:2px;align-items:stretch;height:44px">
            <div style="width:2px;background:var(--text)"></div><div style="width:4px;background:var(--text)"></div><div style="width:1px;background:var(--text)"></div>
            <div style="width:3px;background:var(--text)"></div><div style="width:1px;background:var(--text)"></div><div style="width:4px;background:var(--text)"></div>
            <div style="width:2px;background:var(--text)"></div><div style="width:1px;background:var(--text)"></div><div style="width:3px;background:var(--text)"></div>
            <div style="width:2px;background:var(--text)"></div><div style="width:4px;background:var(--text)"></div><div style="width:1px;background:var(--text)"></div>
          </div>
          <div style="position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scanline 1.6s ease-in-out infinite"></div>
        </div>
      </sc-if>

      <sc-if value="{{ isAi }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative;width:90px;height:90px;display:grid;place-items:center">
          <div style="width:64px;height:64px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-l)"></div>
          <div style="position:absolute;top:2px;right:8px;width:8px;height:8px;border-radius:99px;background:var(--accent);animation:spark 1.3s ease-in-out infinite"></div>
          <div style="position:absolute;bottom:10px;left:4px;width:6px;height:6px;border-radius:99px;background:var(--accent);animation:spark 1.3s ease-in-out .3s infinite"></div>
          <div style="position:absolute;top:14px;left:0px;width:5px;height:5px;border-radius:99px;background:var(--accent);animation:spark 1.3s ease-in-out .6s infinite"></div>
        </div>
      </sc-if>
    </div>

    <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15">{{ title }}</div>
    <div style="margin-top:10px;font-size:15.5px;line-height:1.5;color:var(--muted)">{{ body }}</div>

    <div style="display:flex;justify-content:center;gap:7px;margin:22px 0 16px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="2">
        <div style="width:7px;height:7px;border-radius:99px;background:var(--accent);opacity:{{ d.opacity }}"></div>
      </sc-for>
    </div>

    <button type="button" onClick="{{ next }}" style="width:100%;height:52px;border-radius:16px;background:var(--accent);color:var(--onaccent);font-size:16px;font-weight:650">{{ buttonLabel }}</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const STEPS = [
  {
    title: 'Escanea el código de barras',
    body: 'Apunta la cámara a las rayas del envase y rellenamos nombre, cantidad y caducidad si el producto la trae.',
  },
  {
    title: '¿Sin código? Apúntale igual',
    body: 'Nuestra IA reconoce el producto por foto y te deja los datos listos para revisar antes de guardar.',
  },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const step = this.state.step;
    const last = step === STEPS.length - 1;
    const page = STEPS[step];
    return {
      isBarcode: step === 0,
      isAi: step === 1,
      title: page.title,
      body: page.body,
      dots: STEPS.map((_, i) => ({ opacity: i === step ? 1 : 0.3 })),
      buttonLabel: last ? 'Entendido' : 'Siguiente',
      next: () => this.setState({ step: last ? 0 : step + 1 }),
      skip: () => this.setState({ step: 0 }),
    };
  }
}
</script>
</body>
</html>
