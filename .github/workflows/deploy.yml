# Production deploy. Every push to main deploys only what changed:
#   app/supabase/migrations/**  -> Supabase database (supabase db push), runs first
#   app/supabase/functions/**   -> Supabase Edge Functions
#   app/** (except supabase/)   -> Cloudflare Worker "rezet" (rezet.jarsss8.es)
#   mcp/** or app/src/domain/** -> Cloudflare Worker "rezet-mcp" (rezet-mcp.jarsss8.es)
# Keep these path rules in sync with .claude/skills/deploying-to-main/deploy-report.mjs.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Deploy every target even if nothing changed
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      mcp: ${{ steps.filter.outputs.mcp }}
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            app:
              - 'app/**'
              - '!app/supabase/**'
            mcp:
              - 'mcp/**'
              - 'app/src/domain/**'
            migrations:
              - 'app/supabase/migrations/**'
            functions:
              - 'app/supabase/functions/**'

  migrations:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.migrations == 'true' || github.event.inputs.force_all == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL" || { echo "::error::Missing secret SUPABASE_DB_URL"; exit 1; }
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3
        with:
          version: 2.117.0
      - name: Pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  functions:
    needs: [changes, migrations]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.migrations.result != 'failure' &&
      (needs.changes.outputs.functions == 'true' || github.event.inputs.force_all == 'true')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing variable SUPABASE_PROJECT_REF"; exit 1; }
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3
        with:
          version: 2.117.0
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Check for orphaned deployed functions
        run: |
          # `supabase functions deploy` nunca borra: si se elimina una función del
          # repositorio, sigue viva y servida en producción, fuera de revisión.
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r '.[] | select(.status == "ACTIVE") | .slug' | LC_ALL=C sort > /tmp/deployed.txt
          find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | LC_ALL=C sort > /tmp/insource.txt
          if comm -23 /tmp/deployed.txt /tmp/insource.txt | grep -q .; then
            echo "::error::Estas funciones están desplegadas pero no existen en el repositorio:"
            comm -23 /tmp/deployed.txt /tmp/insource.txt
            echo "::error::Bórralas con 'supabase functions delete <slug>' o restaura su código."
            exit 1
          fi
          echo "Sin funciones huérfanas."

  app:
    needs: [changes, migrations]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.migrations.result != 'failure' &&
      (needs.changes.outputs.app == 'true' || github.event.inputs.force_all == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_KOMPRAPP_SUPABASE_URL: ${{ secrets.VITE_KOMPRAPP_SUPABASE_URL }}
          VITE_KOMPRAPP_SUPABASE_ANON_KEY: ${{ secrets.VITE_KOMPRAPP_SUPABASE_ANON_KEY }}
      - name: Deploy Worker rezet
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: 4.131.2
          command: deploy

  mcp:
    needs: [changes, migrations]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.migrations.result != 'failure' &&
      (needs.changes.outputs.mcp == 'true' || github.event.inputs.force_all == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run types:worker
      - run: npm run lint
      - run: npm test
      - name: Deploy Worker rezet-mcp
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp
          wranglerVersion: 4.129.0
          command: deploy

  # Tags vX.Y.Z (app/package.json) and publishes its CHANGELOG.md section, only once
  # every deploy job has succeeded, so a tag always matches what is live.
  release:
    needs: [changes, migrations, functions, app, mcp]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          node tools/release/release-notes.mjs "$version" > release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Rezet $version" --notes-file release-notes.md
